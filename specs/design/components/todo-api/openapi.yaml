openapi: 3.0.3
info:
  title: Todo API
  version: 0.1.0
  description: Manages a signed-in user's own todo items.
servers:
  - url: /
paths:
  /me/todo-items:
    get:
      operationId: listMyTodoItems
      summary: The caller's todo items
      security:
        - oauth2: [todo-items:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: A page of the caller's todo items
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TodoItem' }
        '401':
          description: Missing or invalid sign-in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createTodoItem
      summary: Create a todo item for the caller
      security:
        - oauth2: [todo-items:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoItemInput' }
      responses:
        '201':
          description: The created todo item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoItem' }
        '400':
          description: Invalid todo item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing or invalid sign-in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/todo-items/{itemId}:
    get:
      operationId: getMyTodoItem
      summary: The caller's single todo item
      security:
        - oauth2: [todo-items:read]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The todo item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoItem' }
        '401':
          description: Missing or invalid sign-in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such todo item for this caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      operationId: updateTodoItem
      summary: Update the caller's todo item (title, due date, done)
      security:
        - oauth2: [todo-items:write]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoItemUpdate' }
      responses:
        '200':
          description: The updated todo item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoItem' }
        '400':
          description: Invalid update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing or invalid sign-in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such todo item for this caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteTodoItem
      summary: Delete the caller's todo item
      security:
        - oauth2: [todo-items:write]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Deleted
        '401':
          description: Missing or invalid sign-in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such todo item for this caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            todo-items:read: Read the caller's own todo items
            todo-items:write: Create, update and delete the caller's own todo items
  schemas:
    TodoItem:
      type: object
      required: [id, title, done, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        done: { type: boolean }
        dueDate: { type: string, format: date, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TodoItemInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        dueDate: { type: string, format: date, nullable: true }
    TodoItemUpdate:
      type: object
      properties:
        title: { type: string }
        dueDate: { type: string, format: date, nullable: true }
        done: { type: boolean }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
security:
  - oauth2: []
